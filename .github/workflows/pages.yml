name: Deploy Midgard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Install dependencies
        run: npm ci
      - name: Test simulation, saves and rendering
        run: npm test
      - name: Install the validation browser
        run: npx playwright install --with-deps chromium
      - name: Verify native WebCanvas ownership across garbage collection
        run: npm run test:lifetime
      - name: Verify repeated map editor cancellation
        run: npm run test:editor
      - name: Verify splash handoff without hidden game frames
        run: npm run test:splash
      - name: Draw and complete roads around the first camp
        run: npm run test:roads
      - name: Verify visible-object picking and friendly selection across renderers
        run: npm run test:picking
      - name: Verify splash and priority audio loading
        run: npm run test:loading
      - name: Verify mobile audio before background samples finish
        run: npm run test:audio
      - name: Verify work contacts against decoded audio and rendered poses
        run: npm run test:work
      - name: Build for the Pages URL
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Upload the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
